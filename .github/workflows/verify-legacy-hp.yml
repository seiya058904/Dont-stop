name: Verify legacy HP compatibility
on:
  pull_request:
permissions:
  contents: read
jobs:
  legacy-hp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: |
          for pass in 1 2; do
            "$GODOT" --headless --path "Don't stop" --editor --import --quit > "$RUNNER_TEMP/import-$pass.log" 2>&1
          done
          if grep -E '^(ERROR:|SCRIPT ERROR:)' "$RUNNER_TEMP/import-2.log" | grep -v 'resources still in use'; then exit 1; fi
      - name: Test historical and diagnostic HP
        run: |
          for name in LegacyHpCompatibility B17Saved P0SaveSanity; do
            timeout 300 "$GODOT" --headless --path "Don't stop" --quit-after 60000 "res://tests/$name.tscn" > "$RUNNER_TEMP/$name.log" 2>&1
            cat "$RUNNER_TEMP/$name.log"
            if grep -E '^FAIL |^SCRIPT ERROR' "$RUNNER_TEMP/$name.log"; then exit 1; fi
            grep -q '^PASS ' "$RUNNER_TEMP/$name.log"
          done
