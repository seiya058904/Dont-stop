name: Build and deploy Web release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_RELEASE_BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable
  PLAYWRIGHT_VERSION: 1.60.0
  PAGES_URL: https://seiya058904.github.io/game-prototype-lab/index.html

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Godot and Web export template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$GODOT_RELEASE_BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$GODOT_RELEASE_BASE/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            --output "$RUNNER_TEMP/godot/templates.tpz"
          unzip -p "$RUNNER_TEMP/godot/templates.tpz" templates/version.txt \
            > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"
          unzip -p "$RUNNER_TEMP/godot/templates.tpz" templates/web_nothreads_release.zip \
            > "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"
          echo "GODOT=$RUNNER_TEMP/godot/bin/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project and export Web build
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path TowDownGame-Iteration --editor --import --quit \
            --log-file "$RUNNER_TEMP/godot/import.log"
          mkdir -p TowDownGame-Iteration/build/web
          "$GODOT" --headless --path TowDownGame-Iteration \
            --export-release "Web Release" build/web/index.html \
            --log-file "$RUNNER_TEMP/godot/export.log"
          test -s TowDownGame-Iteration/build/web/index.html
          test -s TowDownGame-Iteration/build/web/index.pck
          test -s TowDownGame-Iteration/build/web/index.wasm
          test -s TowDownGame-Iteration/build/web/index.js
          # Branding asset referenced by the custom loader / favicon.
          cp TowDownGame-Iteration/game-icon.png TowDownGame-Iteration/build/web/game-icon.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: TowDownGame-Iteration/build/web

      - name: Upload Web build for smoke jobs
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: TowDownGame-Iteration/build/web
          retention-days: 3

  browser-smoke:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check out source (smoke scripts)
        uses: actions/checkout@v4

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium

      - name: Serve build and run browser smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-evidence
          python3 -m http.server 8788 --directory build/web &
          sleep 2
          curl --fail --silent --show-error http://localhost:8788/index.html > /dev/null
          node TowDownGame-Iteration/tools/smoke-web.js \
            http://localhost:8788/index.html smoke-evidence 2>&1 | tee smoke-evidence/smoke.log
          node TowDownGame-Iteration/tools/save-audit-web.js \
            http://localhost:8788/index.html "$RUNNER_TEMP/saveaudit" 2>&1 | tee smoke-evidence/save-audit.log
          xvfb-run -a node TowDownGame-Iteration/tools/pointer-lock-e2e.js \
            http://localhost:8788/index.html smoke-evidence 2>&1 | tee smoke-evidence/pointer-lock-e2e.log

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: smoke-evidence
          retention-days: 14

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: [build, browser-smoke]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  online-smoke:
    name: Online smoke (deployed Pages)
    runs-on: ubuntu-24.04
    needs: deploy
    steps:
      - name: Check out source (smoke scripts)
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium

      - name: Run online smoke against production Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p online-evidence
          curl --fail --silent --show-error "$PAGES_URL" -o /dev/null
          node TowDownGame-Iteration/tools/smoke-web.js \
            "$PAGES_URL" online-evidence 2>&1 | tee online-evidence/online-smoke.log
          xvfb-run -a node TowDownGame-Iteration/tools/pointer-lock-e2e.js \
            "$PAGES_URL" online-evidence 2>&1 | tee online-evidence/online-pointer-lock-e2e.log

      - name: Upload online smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-smoke-evidence
          path: online-evidence
          retention-days: 14
