name: Build and deploy Web release

# ---------------------------------------------------------------------------
# WHY THIS FILE LOOKS THE WAY IT DOES
#
# The pipeline used to cost about 3.5 hours for one main deploy. Measured on
# run 34954529853 / 34962338505:
#
#   build 45s -> Browser smoke 1h44m30s -> deploy 13s -> Online smoke 1h41m6s
#
# Almost all of it was two serial jobs that re-drove the whole game through
# Playwright and measured everything with page.screenshot(). The Web export uses
# the nothreads template, so the game loop owns the browser main thread and every
# capture or evaluate has to wait for a slot on it: ~32 ms idle, ~30 s on CI. The
# gates now read the game's own read-only state channel instead (?probe=1), which
# costs no page round trip, so the same coverage runs in minutes.
#
# What this file therefore guarantees:
#   * Build once. One `build` job exports the Web build, names it by digest, and
#     is the only place a build is produced.
#   * Test the exact bytes that ship. Every gate downloads that one `web-build`
#     artifact; nothing is rebuilt for a test.
#   * Deploy the exact bytes that were tested. The Pages artifact is uploaded
#     from the same directory in the same job, and the online check compares the
#     live page's SHA *and* payload digest against this run's identity.
#   * Gates run in parallel (smoke / save-audit / aim-core / aim-fault /
#     menu-return) and the deploy waits for all of them. The aim acceptance gate
#     is one script split across two jobs purely for wall-clock: the fault
#     injection waits out the loader's own 45 s quiet window and shares no state
#     with the aim chain, so running it alongside costs nothing and takes 78 s
#     off the critical path. Both jobs must pass, and together they still assert
#     all 65 of the gate's contracts.
#   * A PR runs the gates but can never deploy. A main push deploys.
#   * A docs-only change does not pay for a game build.
#   * Layered testing: FAST and RELEASE on every push/PR, SOAK nightly.
#
# Budgets held by this file:
#   build                  <  5 min   (warm caches; 12 min ceiling for a cold run)
#   each browser gate      < 10 min
#   five-cycle menu return < 10-15 min
#   pre-deploy total       < 20 min
#   deploy + online smoke  < 10 min   (online smoke is a <=5 min script)
#   main push, end to end  < 30 min
# Every job carries an explicit timeout-minutes so a hang fails the run instead
# of occupying a runner for hours; the scripts carry their own watchdogs too.
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
  # Requirement: a pull request into main runs the gates, and can never deploy.
  # github.ref is refs/pull/N/merge there, so the deploy job's own guard is false.
  pull_request:
    branches: [main]
  schedule:
    # The SOAK layer, off-peak. Same gates, a 20-cycle return instead of 5, and a
    # fresh build so a leak that five laps cannot see has a chance to show.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Also deploy to production Pages (main branch only)'
        type: boolean
        default: false
      menu_cycles:
        description: 'Menu-return cycles for this dispatch (5 = release, 20 = soak)'
        type: string
        default: '5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A newer push to the same PR may supersede that PR's run, but a production
  # deploy must never be cancelled half-way through, so only PR runs cancel.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_RELEASE_BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable
  PLAYWRIGHT_VERSION: 1.60.0
  PAGES_URL: https://seiya058904.github.io/Dont-stop/index.html
  # The project directory really is named "Don't stop" (apostrophe and space
  # included). Bash needs the quotes; YAML must not, because a scalar that opens
  # with a quote has to close it before anything else follows.
  PROJECT_PATH: "Don't stop"
  # The testing layers. FAST and RELEASE are always on; SOAK is the nightly run.
  TIER: ${{ github.event_name == 'schedule' && 'soak' || 'release' }}
  MENU_CYCLES: ${{ inputs.menu_cycles || (github.event_name == 'schedule' && '20' || '5') }}

jobs:
  # ------------------------------------------------------------------------ #
  # Scope: does this change need a game built at all? A docs-only commit must
  # not spend the runner time a Web export costs - but the workflow still has to
  # run, so a docs-only PR reports a real (cheap) result instead of nothing.
  # ------------------------------------------------------------------------ #
  changes:
    name: Scope (docs-only detection)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      game: ${{ steps.scope.outputs.game }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the game needs rebuilding
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          game=true
          base=""
          changed=""
          case "${{ github.event_name }}" in
            push)         base="${{ github.event.before }}" ;;
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            *)            base="" ;;
          esac
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$base" "${{ github.sha }}")
            if [ -n "$changed" ]; then
              # docs-only == every changed path is documentation. The project
              # folder's apostrophe is matched with a dot so the pattern needs no
              # quoting inside this script.
              non_doc=$(printf '%s\n' "$changed" | grep -vE '^(docs/)|(^Don.t stop/docs/)|(\.md$)' || true)
              if [ -z "$non_doc" ]; then game=false; fi
            fi
          fi
          echo "game=$game" >> "$GITHUB_OUTPUT"
          {
            echo "### Scope"
            echo "- tier: \`${TIER}\`"
            echo "- needs a game build: \`${game}\`"
            echo "- changed paths:"
            if [ -n "$changed" ]; then printf '  - `%s`\n' $changed; else echo "  - (nothing to compare; treating as a real change)"; fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "scope: game=$game tier=${TIER}"

  # ------------------------------------------------------------------------ #
  # Build once. Everything downstream consumes these bytes, and only these.
  # ------------------------------------------------------------------------ #
  build:
    name: Build Web (once, exact artifact)
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      artifact_digest: ${{ steps.identity.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache the Godot binary and the Web export template
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          # The export templates archive is ~600 MB and only one template is
          # used; downloading it once per run was pure waste.
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads-v1

      - name: Install pinned Godot and Web export template (cache-aware)
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/godot/bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          TPLZ="$RUNNER_TEMP/godot/templates.tpz"
          DEST="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$RUNNER_TEMP/godot/bin" "$DEST"
          if [ ! -x "$BIN" ]; then
            echo "godot binary not cached; downloading"
            curl --fail --location --retry 3 --retry-delay 2 \
              "$GODOT_RELEASE_BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
              --output "$RUNNER_TEMP/godot/godot.zip"
            unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          else
            echo "godot binary restored from cache"
          fi
          if [ ! -s "$TPLZ" ]; then
            echo "export templates not cached; downloading"
            curl --fail --location --retry 3 --retry-delay 2 \
              "$GODOT_RELEASE_BASE/Godot_v${GODOT_VERSION}_export_templates.tpz" \
              --output "$TPLZ"
          else
            echo "export templates restored from cache"
          fi
          # Only the nothreads release template is needed, so the archive stays
          # cached whole and only this member is unpacked into place.
          unzip -p "$TPLZ" templates/version.txt > "$DEST/version.txt"
          unzip -p "$TPLZ" templates/web_nothreads_release.zip > "$DEST/web_nothreads_release.zip"
          echo "GODOT=$BIN" >> "$GITHUB_ENV"

      - name: Import project and export Web build
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$PROJECT_PATH" --editor --import --quit \
            --log-file "$RUNNER_TEMP/godot/import.log"
          mkdir -p "$PROJECT_PATH/build/web"
          # Export path is relative to the project directory (that is how Godot
          # resolves it), and --path is the project directory, so this stays
          # inside it instead of nesting "Don't stop/Don't stop".
          "$GODOT" --headless --path "$PROJECT_PATH" \
            --export-release "Web Release" build/web/index.html \
            --log-file "$RUNNER_TEMP/godot/export.log"
          test -s "$PROJECT_PATH/build/web/index.html"
          test -s "$PROJECT_PATH/build/web/index.pck"
          test -s "$PROJECT_PATH/build/web/index.wasm"
          test -s "$PROJECT_PATH/build/web/index.js"
          # Branding asset referenced by the custom loader / favicon. It is
          # produced by the exporter itself (index.icon.png), so this only
          # asserts it is really there instead of copying a second copy in.
          test -s "$PROJECT_PATH/build/web/index.icon.png"

      - name: Stamp build identity (commit SHA + artifact digest)
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          # A 200 response or a correct <title> does not prove WHICH build is
          # live. Two identities go into the page: the commit it was built from,
          # and a digest over the payload bytes themselves. The digest - not the
          # SHA - is what ties "the thing that was tested" to "the thing that is
          # served", because a rebuild of the same commit changes it. The same
          # script is used for a local run, so the two cannot drift.
          python3 "$PROJECT_PATH/tools/stamp-build-identity.py" \
            "$PROJECT_PATH/build/web" "$GITHUB_SHA" "$RUNNER_TEMP/build-identity.json"

      - name: Summarise the build identity
        shell: bash
        run: |
          {
            echo "### Web build identity"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| artifact digest | \`${ARTIFACT_DIGEST}\` |"
            echo "| digest covers | \`index.wasm \\|\\| index.pck \\|\\| index.js\` (sha256) |"
            echo "| tier | \`${TIER}\` |"
            echo "| menu-return cycles | \`${MENU_CYCLES}\` |"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (the exact bytes that will be served)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Don't stop/build/web"

      - name: Upload the Web build for the gate jobs
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: "Don't stop/build/web"
          retention-days: 3

      - name: Upload the build identity for the online check
        uses: actions/upload-artifact@v4
        with:
          name: build-identity
          path: ${{ runner.temp }}/build-identity.json
          retention-days: 3

  # This is the branch-protection check. It must run on every PR, including a
  # docs-only PR where the expensive Web export is intentionally skipped.
  # Game changes still require the real build to succeed; docs-only changes
  # take the explicit no-build path instead of leaving a required check pending.
  web-required-gate:
    name: Web required gate
    needs: [changes, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify Web build requirement
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          GAME_SCOPE: ${{ needs.changes.outputs.game }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "Scope job did not succeed: $SCOPE_RESULT"
            exit 1
          fi
          if [[ "$GAME_SCOPE" == true ]]; then
            if [[ "$BUILD_RESULT" != success ]]; then
              echo "Game changes require a successful Web build; got: $BUILD_RESULT"
              exit 1
            fi
            echo "Web build passed for a game-changing PR."
          elif [[ "$GAME_SCOPE" == false ]]; then
            if [[ "$BUILD_RESULT" != success && "$BUILD_RESULT" != skipped ]]; then
              echo "Docs-only scope had an unexpected Web build result: $BUILD_RESULT"
              exit 1
            fi
            echo "Docs-only PR: Web build intentionally skipped and explicitly accepted."
          else
            echo "Scope job did not emit a valid game=true/false result."
            exit 1
          fi

  # ------------------------------------------------------------------------ #
  # The gates. Five parallel jobs, all downloading the one build above. The
  # deploy waits for every one of them.
  #
  #   FAST    smoke, save-audit         cheap, always on
  #   RELEASE aim-core, aim-fault,      the full acceptance layer. aim-core and
  #           menu-return               aim-fault are the two halves of
  #                                     tools/web-aim-e2e.js, split by phase so
  #                                     the fault injection stops serialising
  #                                     the aim chain. Both must pass.
  #   SOAK    the same jobs, nightly, with a 20-cycle return
  # ------------------------------------------------------------------------ #
  browser-gates:
    name: "Gate ${{ matrix.name }} (${{ matrix.tier }})"
    needs: [changes, build]
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: smoke,       tier: FAST,    script: tools/smoke-web.js,             timeout: 10 }
          - { name: save-audit,  tier: FAST,    script: tools/save-audit-web.js,        timeout: 10 }
          - { name: aim-core,    tier: RELEASE, script: tools/web-aim-e2e.js,           timeout: 12 }
          - { name: aim-fault,   tier: RELEASE, script: tools/web-aim-e2e.js,           timeout: 8 }
          - { name: menu-return, tier: RELEASE, script: tools/web-menu-return-e2e.js,   timeout: 15 }
          # B11. The claims this batch makes can only be judged in a browser: stages 31/35/39/40 really
          # start Hell rounds on a fresh profile, and a frozen laser lane really fires at the geometry
          # it froze. The gate reads the game's own read-only channel - including each live footprint's
          # identity, countdown, direction, declared sweep and lock state - so it needs no screenshot
          # diffing, and it asserts on the game's own per-stage evidence lines.
          - { name: stages-fair,  tier: RELEASE, script: tools/web-b11-stagerun.js,    timeout: 15 }
    steps:
      - name: Check out source (gate scripts)
        uses: actions/checkout@v4

      - name: Download the Web build under test (the same bytes as every other job)
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm and the Playwright browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: pw-${{ env.PLAYWRIGHT_VERSION }}-chromium-v1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium

      - name: Run the gate
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ matrix.name }}-evidence"
          mkdir -p "$OUT"
          python3 -m http.server 8788 --directory build/web &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://localhost:8788/index.html > /dev/null
          # Every gate script takes the same shape: <url> <evidenceDir> [gateArg].
          set -- "http://localhost:8788/index.html" "$OUT"
          case "${{ matrix.name }}" in
            menu-return) set -- "$@" "${MENU_CYCLES:-5}" ;;
            # The two halves of the aim gate select their phases explicitly; the
            # script's default is `all`, which would run them serialised.
            aim-core)    set -- "$@" core ;;
            aim-fault)   set -- "$@" fault ;;
            # The B11 gate walks four Hell stages and reads the telegraph channel; it takes only the URL
            # and an evidence directory. The sustained-load measurement is deliberately NOT run on a
            # software-rendered CI runner - see docs/iteration/B11-FAIR-FIGHT-AND-PERF.md.
            stages-fair) set -- "$@" ;;
          esac
          START=$SECONDS
          if ! node "$PROJECT_PATH/${{ matrix.script }}" "$@" 2>&1 | tee "$OUT/run.log"; then
            echo "GATE_${{ matrix.name }}=FAIL tier=${{ matrix.tier }} after $((SECONDS-START))s" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
          echo "GATE_${{ matrix.name }}=PASS tier=${{ matrix.tier }} wall_clock=$((SECONDS-START))s budget=${{ matrix.timeout }}m" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.name }}-evidence
          path: ${{ matrix.name }}-evidence
          retention-days: 14

  # ------------------------------------------------------------------------ #
  # Production only. A workflow_dispatch on a candidate branch builds and tests
  # but never deploys (github.ref is the branch, and inputs.deploy defaults to
  # false), the nightly soak never deploys, and a PR never deploys.
  # ------------------------------------------------------------------------ #
  deploy:
    name: Deploy the tested artifact to Pages
    needs: [changes, build, browser-gates]
    if: >-
      needs.changes.outputs.game == 'true'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------------------------ #
  # Online smoke: a <=5 min script, not a re-run of the 100-minute job it
  # replaced. It proves the live page IS this build (commit + digest), that the
  # payload files are the exact ones that were tested, and then walks the
  # product's own state once through menu -> round -> pause -> leave -> again.
  # ------------------------------------------------------------------------ #
  online-smoke:
    name: Online smoke (deployed Pages, <=5 min)
    needs: [deploy]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source (online smoke script)
        uses: actions/checkout@v4

      - name: Restore the build identity this run produced
        uses: actions/download-artifact@v4
        with:
          name: build-identity
          path: build-identity

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm and the Playwright browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: pw-${{ env.PLAYWRIGHT_VERSION }}-chromium-v1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium

      - name: Verify the deployed build is THIS build, then walk it once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p online-evidence
          DIGEST=$(python3 -c "import json;print(json.load(open('build-identity/build-identity.json'))['artifact_digest'])")
          START=$SECONDS
          node "$PROJECT_PATH/tools/online-smoke.js" \
            "$PAGES_URL" "$DIGEST" "$GITHUB_SHA" \
            online-evidence build-identity/build-identity.json \
            2>&1 | tee online-evidence/online-smoke.log
          echo "ONLINE_SMOKE=PASS identity=sha:$GITHUB_SHA digest:$DIGEST wall_clock=$((SECONDS-START))s budget=5m" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Upload online evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-smoke-evidence
          path: online-evidence
          retention-days: 14
