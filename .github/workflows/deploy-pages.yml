name: Build and deploy Web release

# PR proves safety; main builds/tests exactly one final candidate and publishes it.
# Heavy browser/soak acceptance is monthly, Release, or explicit dispatch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 1 * *'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: Also deploy to production Pages (main only, after full acceptance)
        type: boolean
        default: false
      menu_cycles:
        description: Continuous menu-return cycles (20 = full soak)
        type: choice
        options: ['20', '5']
        default: '20'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_RELEASE_BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable
  PLAYWRIGHT_VERSION: 1.60.0
  PAGES_URL: https://seiya058904.github.io/Dont-stop/index.html
  PROJECT_PATH: "Don't stop"
  TIER: ${{ github.event_name == 'push' && 'release' || (github.event_name == 'pull_request' && 'pr' || 'full') }}
  MENU_CYCLES: ${{ inputs.menu_cycles || ((github.event_name == 'schedule' || github.event_name == 'release') && '20' || '1') }}

jobs:
  build:
    name: Build and test exact Web artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      game: ${{ steps.scope.outputs.game }}
      artifact_digest: ${{ steps.identity.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Scope (docs-only detection, no extra runner)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          game=true
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            # Fetch only the comparison commit, rather than the entire repository history.
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
            non_doc=$(printf '%s\n' "$changed" | grep -vE '^(docs/)|(^Don.t stop/docs/)|(\.md$)' || true)
            if [ -n "$changed" ] && [ -z "$non_doc" ]; then game=false; fi
          fi
          echo "game=$game" >> "$GITHUB_OUTPUT"
          echo "Scope: game=$game tier=$TIER" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/setup-godot
        if: steps.scope.outputs.game == 'true'
        with:
          web: 'true'

      - name: Import project (once, fail fast)
        if: steps.scope.outputs.game == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$PROJECT_PATH" --editor --import --quit --log-file "$RUNNER_TEMP/import.log"
          python3 "$PROJECT_PATH/tools/b194_import_check.py" "$PROJECT_PATH" "$RUNNER_TEMP/import.log"

      - name: Stage-specific native regression preflight
        if: steps.scope.outputs.game == 'true'
        shell: bash
        run: |
          set -euo pipefail
          run_case () {
            local name="$1"
            local log="$RUNNER_TEMP/preflight-$name.log"
            set +e
            timeout 300 "$GODOT" --headless --path "$PROJECT_PATH" --quit-after 60000 \
              "res://tests/$name.tscn" > "$log" 2>&1
            local code=$?
            set -e
            local issues checks
            issues=$(grep -cE '^FAIL |^SCRIPT ERROR' "$log" || true)
            checks=$(grep -cE '^PASS ' "$log" || true)
            echo "::group::preflight $name (exit $code, checks $checks, issues $issues)"
            tail -n 40 "$log"
            echo '::endgroup::'
            if [ "$code" -ne 0 ] || [ "$issues" -ne 0 ] || [ "$checks" -eq 0 ]; then
              echo "PREFLIGHT_FAILED: $name"
              grep -E '^FAIL |^SCRIPT ERROR' "$log" || true
              exit 1
            fi
          }
          # Main only checks the imported boot/lazy scripts and save sanitation.
          run_case B194Contracts
          run_case P0SaveSanity
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            run_case BaselineRegression
            run_case CombatReadability
            run_case WeaponVisualPose
            run_case CampPresentation
            run_case CameraTransitions
            run_case B17Contracts
            run_case M3Weapons
            # Former standalone legacy-hp job, sharing this one engine/import.
            run_case LegacyHpCompatibility
            run_case B17Saved
          fi

      - name: Export the validated Web candidate
        if: steps.scope.outputs.game == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_PATH/build/web"
          # Export path is relative to the project directory (that is how Godot
          # resolves it), and --path is the project directory, so this stays
          # inside it instead of nesting "Don't stop/Don't stop".
          "$GODOT" --headless --path "$PROJECT_PATH" \
            --export-release "Web Release" build/web/index.html \
            --log-file "$RUNNER_TEMP/export.log"
          if grep -E '^(ERROR:|SCRIPT ERROR:)' "$RUNNER_TEMP/export.log"; then
            echo 'Export reported an error.'
            exit 1
          fi
          test -s "$PROJECT_PATH/build/web/index.html"
          test -s "$PROJECT_PATH/build/web/index.pck"
          test -s "$PROJECT_PATH/build/web/index.wasm"
          test -s "$PROJECT_PATH/build/web/index.js"
          # Branding asset referenced by the custom loader / favicon. It is
          # produced by the exporter itself (index.icon.png), so this only
          # asserts it is really there instead of copying a second copy in.
          test -s "$PROJECT_PATH/build/web/index.icon.png"

      - name: Stamp build identity (commit SHA + artifact digest)
        id: identity
        if: steps.scope.outputs.game == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # A 200 response or a correct <title> does not prove WHICH build is
          # live. Two identities go into the page: the commit it was built from,
          # and a digest over the payload bytes themselves. The digest - not the
          # SHA - is what ties "the thing that was tested" to "the thing that is
          # served", because a rebuild of the same commit changes it. The same
          # script is used for a local run, so the two cannot drift.
          python3 "$PROJECT_PATH/tools/stamp-build-identity.py" \
            "$PROJECT_PATH/build/web" "$GITHUB_SHA" "$RUNNER_TEMP/build-identity.json"

      - uses: ./.github/actions/setup-browser
        if: steps.scope.outputs.game == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')

      - name: Real browser gates on the final candidate
        if: steps.scope.outputs.game == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-evidence menu-return-evidence
          python3 -m http.server 8788 --directory "$PROJECT_PATH/build/web" &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8788/index.html > /dev/null; then break; fi
            sleep 0.2
          done
          export E2E_SCREENSHOTS=none
          node "$PROJECT_PATH/tools/web-loader-check.js" http://localhost:8788/index.html smoke-evidence/loader
          # Parallel processes share one browser installation and one immutable export.
          # wait -n propagates the first failure; the remaining process is stopped.
          pids=()
          node "$PROJECT_PATH/tools/smoke-web.js" http://localhost:8788/index.html smoke-evidence > smoke-evidence/run.log 2>&1 &
          pids+=($!)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node "$PROJECT_PATH/tools/web-menu-return-e2e.js" http://localhost:8788/index.html menu-return-evidence 1 > menu-return-evidence/run.log 2>&1 &
            pids+=($!)
          fi
          trap 'kill "$SERVER" "${pids[@]}" 2>/dev/null || true' EXIT
          while [ "${#pids[@]}" -gt 0 ]; do
            if ! wait -n -p finished "${pids[@]}"; then
              cat smoke-evidence/run.log
              cat menu-return-evidence/run.log 2>/dev/null || true
              exit 1
            fi
            pending=()
            for pid in "${pids[@]}"; do
              if [ "$pid" != "$finished" ]; then pending+=("$pid"); fi
            done
            pids=("${pending[@]}")
          done
          cat smoke-evidence/run.log
          cat menu-return-evidence/run.log 2>/dev/null || true
          # Recompute all payload hashes after the browser tests: fail if they changed.
          node "$PROJECT_PATH/tools/verify-pages-deployment.js" http://localhost:8788/index.html "$GITHUB_SHA" "$RUNNER_TEMP/build-identity.json" smoke-evidence/identity

      - name: Upload tested Pages bytes (no rebuild)
        if: steps.scope.outputs.game == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Don't stop/build/web"

      - name: Upload Web candidate for full browser acceptance
        if: github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: "Don't stop/build/web"
          retention-days: 3

      - name: Upload build identity
        if: steps.scope.outputs.game == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-identity
          path: ${{ runner.temp }}/build-identity.json
          retention-days: 14

      - name: Upload candidate diagnostics
        if: always() && steps.scope.outputs.game == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evidence
          path: |
            smoke-evidence
            menu-return-evidence
            ${{ runner.temp }}/*.log
          retention-days: 14

  # Keep established PR check names, including explicit docs-only success.
  stable-preflight:
    name: Stable preflight
    needs: build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success

  web-required-gate:
    name: Web required gate
    needs: build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success

  browser-gates:
    name: "Gate ${{ matrix.name }}"
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_budget_minutes || 8 }}
    env:
      GATE_JOB_BUDGET_MINUTES: ${{ matrix.job_budget_minutes || 8 }}
    strategy:
      fail-fast: true
      matrix:
        name: [smoke, save-audit, aim-core, aim-fault, menu-return, stages-fair]
        include:
          - name: menu-return
            # Observed CI cycles span 31-50s: 21 iterations can take 17.5m,
            # before startup/reload. 25m watchdog leaves room for the full soak;
            # 30m job reserves installation and diagnostic-upload time.
            job_budget_minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'release' || inputs.menu_cycles == '20') && 30 || 8 }}
            watchdog_ms: ${{ (github.event_name == 'schedule' || github.event_name == 'release' || inputs.menu_cycles == '20') && 1500000 || 420000 }}
    steps:
      - name: Check out source (gate scripts)
        uses: actions/checkout@v4

      - name: Verify continuous-soak budget contract
        if: matrix.name == 'menu-return'
        run: python3 "$PROJECT_PATH/tools/test-menu-soak-policy.py"

      - name: Download the Web build under test (the same bytes as every other job)
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - uses: actions/download-artifact@v4
        if: matrix.name == 'smoke'
        with:
          name: build-identity
          path: build-identity
      - uses: ./.github/actions/setup-browser

      - name: Run the gate
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ matrix.name }}-evidence"
          mkdir -p "$OUT"
          python3 -m http.server 8788 --directory build/web &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://localhost:8788/index.html > /dev/null
          if [ "${{ matrix.name }}" = smoke ]; then
            node "$PROJECT_PATH/tools/web-loader-check.js" http://localhost:8788/index.html "$OUT/loader"
          fi
          # Every gate script takes the same shape: <url> <evidenceDir> [gateArg].
          set -- "http://localhost:8788/index.html" "$OUT"
          SCRIPT=""
          case "${{ matrix.name }}" in
            smoke) SCRIPT=tools/smoke-web.js ;;
            save-audit) SCRIPT=tools/save-audit-web.js ;;
            aim-core|aim-fault) SCRIPT=tools/web-aim-e2e.js ;;
            menu-return) SCRIPT=tools/web-menu-return-e2e.js ;;
            stages-fair) SCRIPT=tools/web-b11-stagerun.js ;;
            *) exit 2 ;;
          esac
          export E2E_SCREENSHOTS=none
          case "${{ matrix.name }}" in
            menu-return)
              set -- "$@" "${MENU_CYCLES:-5}"
              export E2E_WATCHDOG_MS='${{ matrix.watchdog_ms }}'
              ;;
            # The two halves of the aim gate select their phases explicitly; the
            # script's default is `all`, which would run them serialised.
            aim-core)    set -- "$@" core ;;
            aim-fault)   set -- "$@" fault ;;
            # The B11 gate walks four Hell stages and reads the telegraph channel; it takes only the URL
            # and an evidence directory. The sustained-load measurement is deliberately NOT run on a
            # software-rendered CI runner - see docs/iteration/B11-FAIR-FIGHT-AND-PERF.md.
            stages-fair) set -- "$@" ;;
          esac
          START=$SECONDS
          if ! node "$PROJECT_PATH/$SCRIPT" "$@" 2>&1 | tee "$OUT/run.log"; then
            echo "GATE_${{ matrix.name }}=FAIL tier=${TIER} after $((SECONDS-START))s" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
          if [ "${{ matrix.name }}" = smoke ]; then
            node "$PROJECT_PATH/tools/verify-pages-deployment.js" http://localhost:8788/index.html "$GITHUB_SHA" build-identity/build-identity.json "$OUT/identity"
          fi
          echo "GATE_${{ matrix.name }}=PASS tier=${TIER} wall_clock=$((SECONDS-START))s budget=${GATE_JOB_BUDGET_MINUTES}m cycles=${MENU_CYCLES} watchdog_ms=${E2E_WATCHDOG_MS:-script-default}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.name }}-evidence
          path: ${{ matrix.name }}-evidence
          retention-days: 14

  deploy:
    name: Deploy and verify live Pages identity
    needs: [build, browser-gates]
    # The full matrix is intentionally skipped on daily pushes.
    if: >-
      always() && needs.build.result == 'success'
      && needs.build.outputs.game == 'true'
      && (needs.browser-gates.result == 'success' || needs.browser-gates.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-identity
          path: build-identity
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify production SHA and every payload byte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-evidence
          # Allow bounded CDN propagation, never accept an older SHA or digest.
          for attempt in 1 2 3 4; do
            if node "$PROJECT_PATH/tools/verify-pages-deployment.js" "$PAGES_URL" "$GITHUB_SHA" build-identity/build-identity.json pages-evidence > "pages-evidence/attempt-$attempt.log" 2>&1; then
              cat "pages-evidence/attempt-$attempt.log"
              date -u +'%Y-%m-%dT%H:%M:%SZ' > pages-evidence/verified-at.txt
              echo "PAGES_VERIFICATION=PASS SHA=$GITHUB_SHA artifact=${{ needs.build.outputs.artifact_digest }} verified_at=$(cat pages-evidence/verified-at.txt)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat "pages-evidence/attempt-$attempt.log"
            if [ "$attempt" != 4 ]; then sleep 5; fi
          done
          exit 1
      - name: Upload live identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-verification-evidence
          path: pages-evidence
          retention-days: 30
