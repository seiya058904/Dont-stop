name: Native gameplay tests

# Deliberately separate from deploy-pages.yml: that pipeline was cut from ~3.5 h to about
# 10 minutes and must keep its shape, so the B批's new gameplay contracts get their own
# workflows that run in parallel with it instead of in front of the deploy.
#
# Split into a contracts job and a pressure job because the boss and density audits are
# minutes-long real battles; putting them in the same job as the fast contracts would push a
# single job past its useful timeout for no benefit.
#
# Every case is STATE DRIVEN: each scene drives the real production entry points
# (LevelServer.monsterCreate, Town.depart, the hazard director, the fog gate) and asserts
# engine state, printed counters and saved JSON. No screenshot diffing, no page.evaluate.
on:
  push:
    # A docs-only push cannot change what these tests observe, and the whole suite costs about
    # 30 runner-minutes. deploy-pages.yml already skips its heavy jobs for a docs-only change;
    # this matches it. No test reads a fixture out of docs/ - M11SaveMigration's fixture lives in
    # tests/fixtures/ and everything under docs/iteration/evidence is OUTPUT the tests write.
    # pull_request is deliberately NOT filtered: a PR always gets the full suite.
    paths-ignore:
      - "Don't stop/docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_RELEASE_BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable
  PROJECT_PATH: "Don't stop"

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache the pinned Godot binary
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-native-v2
      - name: Install pinned Godot (cache-aware)
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/godot/bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p "$RUNNER_TEMP/godot/bin"
          if [ ! -x "$BIN" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "$GODOT_RELEASE_BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
              --output "$RUNNER_TEMP/godot/godot.zip"
            unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          fi
          chmod +x "$BIN"
          echo "GODOT=$BIN" >> "$GITHUB_ENV"
      - name: Import the project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$PROJECT_PATH" --import --quit

  contracts:
    needs: setup
    runs-on: ubuntu-24.04
    # B13.1 added M4Talents (the 24-talent behaviour audit) to this job; 30 min keeps the
    # whole contracts block comfortably inside one timeout as cases accumulate. Cases are
    # never dropped to save time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore the pinned Godot binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-native-v2
      - name: Save-file contracts, hazard system, fog and progression
        shell: bash
        env:
          GODOT: ${{ runner.temp }}/godot/bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$PROJECT_PATH" --import --quit
          run_case () {
            local name="$1"; shift
            local log="$RUNNER_TEMP/$name-$(echo "$*" | tr -d ' -').log"
            set +e
            timeout 900 "$GODOT" --headless --path "$PROJECT_PATH" --quit-after 60000 \
              "res://tests/$name.tscn" -- "$@" > "$log" 2>&1
            local code=$?
            set -e
            local issues checks
            issues=$(grep -cE '^FAIL |^SCRIPT ERROR' "$log" || true)
            checks=$(grep -cE '^PASS ' "$log" || true)
            echo "::group::$name $* (exit $code, checks $checks, issues $issues)"
            tail -n 40 "$log"
            echo "::endgroup::"
            if [ "$code" -ne 0 ] || [ "$issues" -ne 0 ] || [ "$checks" -eq 0 ]; then
              echo "FAILED: $name $*"
              grep -E '^FAIL |^SCRIPT ERROR' "$log" || true
              exit 1
            fi
            echo "PASSED: $name $* checks=$checks"
          }
          run_case BaselineRegression
          # B11: the stage table is the product's selectability contract (1-40, always open), and the
          # attack audit is the fairness contract (computed reaction window, frozen lock geometry,
          # bounded contact hit rate). Both are state driven and read the live actors.
          run_case B11Stages
          run_case B11Fairness
          # SaveRunner is deliberately NOT in this list: it fails on origin/main in this
          # environment with "Invalid access to property or key 'instance_id' on a base object
          # of type 'Dictionary'" at SaveRunner.gd:19 (ContractRunner fails the same way), so
          # it is a pre-existing defect in that scene family rather than a B批 contract. The
          # save namespace and migration contract this batch actually touches is asserted by
          # B6Progression, which is green on Linux.
          run_case B6Progression
          run_case B6Progression --hell-unlock
          run_case B3Hazards
          run_case B4Fog
          run_case M6EncounterAudit
          run_case M8Encounters
          # B12 weapon-quality contracts. The heavy 24x3 B12WeaponBench stays OUT of per-PR
          # CI on purpose (it is evidence generation, ~30 min); these assert the frozen
          # evidence against the live catalog and the shop UI instead.
          run_case B12Catalog
          # B17 remeasured evidence seals current sources; B14 remains archived under --b14.
          # Existing floors are retained, including any failing observations.
          run_case B12Strength --b17
          run_case B12Save
          run_case B12UI
          # Pins the B12 clear_line fix: footprint consumes the shared exclusions_dirty
          # flag before the LOS query, freed RIDs must not survive actor churn, and a
          # real wall must still block the ray.
          run_case B12LineOfSightRegression
          # B13 growth contracts: catalog shape, per-item real effects, exact talent
          # magnitudes, economy bands/refunds, the unequip state machine, the shop UI,
          # and the frozen-benchmark strength relation. B13GrowthBench stays OUT of
          # per-PR CI on purpose (it is evidence generation, ~10 min).
          run_case B13Catalog
          run_case B13UpgradeEffects
          run_case B13TalentEffects
          run_case B13Economy
          run_case B13Unequip
          run_case B13UI
          run_case CampPresentation
          run_case PresentationContracts
          run_case PresentationRng
          run_case PresentationLifecycle
          # B13 reworked all 24 talents, so the M4 talent behaviour audit runs in the same
          # job as the B13 contracts that pin their new magnitudes.
          run_case M4Talents
          run_case B13Strength --b17
          run_case B14Loadout
          run_case B14Growth
          run_case B14Rail
          run_case B14Feedback
          run_case B14EncounterContracts
          run_case B17Contracts
          run_case B17Sources
          run_case B17Saved
          run_case B17Resources
          run_case R1Timeline
          run_case B16Camp
          run_case B16Growth
          run_case B16Pickup
          run_case B16Save
          run_case B16Effects
          run_case B16CombatMix
          run_case M3Weapons
      - name: Upload contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-contract-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn

  pressure:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore the pinned Godot binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-native-v2
      - name: Boss phases, Hell density and spawn legality
        shell: bash
        env:
          GODOT: ${{ runner.temp }}/godot/bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$PROJECT_PATH" --import --quit
          run_case () {
            local name="$1"; shift
            local log="$RUNNER_TEMP/$name-$(echo "$*" | tr -d ' ,=-').log"
            set +e
            timeout 1800 "$GODOT" --headless --path "$PROJECT_PATH" --quit-after 90000 \
              "res://tests/$name.tscn" -- "$@" > "$log" 2>&1
            local code=$?
            set -e
            local issues checks
            issues=$(grep -cE '^FAIL |^SCRIPT ERROR' "$log" || true)
            checks=$(grep -cE '^PASS ' "$log" || true)
            echo "::group::$name $* (exit $code, checks $checks, issues $issues)"
            grep -E '^M10 DENSITY |^B5 BOSS |^R3_SPAWN_AUDIT |^B11 PERF ' "$log" || true
            tail -n 30 "$log"
            echo "::endgroup::"
            if [ "$code" -ne 0 ] || [ "$issues" -ne 0 ] || [ "$checks" -eq 0 ]; then
              echo "FAILED: $name $*"
              grep -E '^FAIL |^SCRIPT ERROR' "$log" || true
              exit 1
            fi
            echo "PASSED: $name $* checks=$checks"
          }
          run_case M10Bosses full
          run_case B5Bosses
          run_case M10Density stages=22,31
          run_case M10Density probe stages=22,31
          # The two stages a human reported frame-rate collapse on, measured as real rounds rather
          # than as a synthetic pile of monsters. The gate is convergence, not a frame rate: a CI
          # software renderer cannot report what a player's GPU will do, but it can report whether
          # node/projectile/telegraph counts keep climbing or settle.
          run_case B11Perf stage=39 seconds=75
          run_case B11Perf stage=40 seconds=75
      - name: Upload pressure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-pressure-evidence
          path: |
            ${{ runner.temp }}/*.log
            Don't stop/docs/iteration/evidence/m10/density.json
            Don't stop/docs/iteration/evidence/b/bosses.json
          if-no-files-found: warn
