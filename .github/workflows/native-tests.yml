name: Native gameplay tests

# Full native regressions and pressure run only on manual/monthly/Release candidates.
# The PR import and core contracts live in deploy-pages.yml and expose
# the unchanged protected check name "Stable preflight".
on:
  schedule:
    - cron: '17 3 1 * *'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run_historical_evidence:
        description: 'Run the non-blocking B17 frozen-evidence audit'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_RELEASE_BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable
  PROJECT_PATH: "Don't stop"

jobs:
  setup:
    name: Native candidate preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Pin the released coverage and fail-closed runner policy
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/tags/v1.3.5:refs/tags/v1.3.5
          python3 "$PROJECT_PATH/tools/test-verification-policy.py"
      - name: Import the project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          "$GODOT" --headless --path "$PROJECT_PATH" --editor --import --quit --log-file "$RUNNER_TEMP/import.log"
          python3 "$PROJECT_PATH/tools/b194_import_check.py" "$PROJECT_PATH" "$RUNNER_TEMP/import.log"
          printf '%s\n' "$GITHUB_SHA" > "$PROJECT_PATH/.godot/candidate-sha"
          tar -C "$PROJECT_PATH" -cf "$RUNNER_TEMP/native-import.tar" .godot
      - name: Share the imported candidate (no second import in consumers)
        uses: actions/upload-artifact@v4
        with:
          name: native-import
          path: ${{ runner.temp }}/native-import.tar
          retention-days: 1

  contracts:
    name: "Native ${{ matrix.shard }}"
    needs: setup
    runs-on: ubuntu-24.04
    # Wall-time hang protection; no engine frame limit on full acceptance.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [contracts-1, contracts-2, contracts-3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - uses: actions/download-artifact@v4
        with:
          name: native-import
          path: ${{ runner.temp }}/native-import
      - name: Restore the same imported commit
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$PROJECT_PATH" -xf "$RUNNER_TEMP/native-import/native-import.tar"
          test "$(cat "$PROJECT_PATH/.godot/candidate-sha")" = "$GITHUB_SHA"
      - name: Run isolated timed shard
        run: python3 "$PROJECT_PATH/tools/verify.py" verify-native --shard "${{ matrix.shard }}" --godot "$GODOT" --imported --out "$RUNNER_TEMP/${{ matrix.shard }}"
      - name: Upload every result and diagnostic (including failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.shard }}-evidence
          path: |
            ${{ runner.temp }}/${{ matrix.shard }}/preparation.json
            ${{ runner.temp }}/${{ matrix.shard }}/results.json
            ${{ runner.temp }}/${{ matrix.shard }}/${{ matrix.shard }}/*.log
            ${{ runner.temp }}/${{ matrix.shard }}/${{ matrix.shard }}/results.json
            ${{ runner.temp }}/${{ matrix.shard }}/${{ matrix.shard }}/fixture-evidence
          retention-days: 14
          if-no-files-found: error

  pressure:
    name: "Native ${{ matrix.shard }}"
    needs: setup
    runs-on: ubuntu-24.04
    # Wall-time hang protection; no engine frame limit on full acceptance.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [pressure-1, pressure-2, pressure-3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - uses: actions/download-artifact@v4
        with:
          name: native-import
          path: ${{ runner.temp }}/native-import
      - name: Restore the same imported commit
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$PROJECT_PATH" -xf "$RUNNER_TEMP/native-import/native-import.tar"
          test "$(cat "$PROJECT_PATH/.godot/candidate-sha")" = "$GITHUB_SHA"
      - name: Run isolated timed shard
        run: python3 "$PROJECT_PATH/tools/verify.py" verify-native --shard "${{ matrix.shard }}" --godot "$GODOT" --imported --out "$RUNNER_TEMP/${{ matrix.shard }}"
      - name: Upload every result and diagnostic (including failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.shard }}-evidence
          path: |
            ${{ runner.temp }}/${{ matrix.shard }}/preparation.json
            ${{ runner.temp }}/${{ matrix.shard }}/results.json
            ${{ runner.temp }}/${{ matrix.shard }}/${{ matrix.shard }}/*.log
            ${{ runner.temp }}/${{ matrix.shard }}/${{ matrix.shard }}/results.json
            ${{ runner.temp }}/${{ matrix.shard }}/${{ matrix.shard }}/fixture-evidence
          retention-days: 14
          if-no-files-found: error

  native-required-gate:
    name: Native required gate
    needs: [setup, contracts, pressure]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          SETUP: ${{ needs.setup.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          PRESSURE: ${{ needs.pressure.result }}
        run: test "$SETUP" = success && test "$CONTRACTS" = success && test "$PRESSURE" = success

  historical-evidence:
    name: Historical / frozen evidence audit (informational)
    needs: setup
    if: github.event_name == 'workflow_dispatch' && inputs.run_historical_evidence == true
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - uses: actions/download-artifact@v4
        with:
          name: native-import
          path: ${{ runner.temp }}/native-import
      - name: Restore the already imported candidate
        run: tar -C "$PROJECT_PATH" -xf "$RUNNER_TEMP/native-import/native-import.tar"
      - name: Audit B17 frozen evidence without blocking current CI
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          run_case () {
            local name="$1"; shift
            local log="$RUNNER_TEMP/$name-$(echo "$*" | tr -d ' -').log"
            set +e
            timeout 900 "$GODOT" --headless --path "$PROJECT_PATH" --quit-after 60000 \
              "res://tests/$name.tscn" -- "$@" > "$log" 2>&1
            local code=$?
            set -e
            local issues checks
            issues=$(grep -cE '^FAIL |^SCRIPT ERROR' "$log" || true)
            checks=$(grep -cE '^PASS ' "$log" || true)
            echo "::group::historical $name $* (exit $code, checks $checks, issues $issues)"
            tail -n 40 "$log"
            echo "::endgroup::"
            if [ "$code" -ne 0 ] || [ "$issues" -ne 0 ] || [ "$checks" -eq 0 ]; then
              failed=1
              echo "HISTORICAL_AUDIT_FAILED: $name $*"
              grep -E '^FAIL |^SCRIPT ERROR' "$log" || true
            fi
          }
          run_case B12Strength --b17
          run_case B13Strength --b17
          exit "$failed"
      - name: Upload historical audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-historical-evidence-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn
