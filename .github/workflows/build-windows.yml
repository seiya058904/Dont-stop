name: Build Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_RELEASE_BASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable
  # The project directory really is named "Don't stop" (apostrophe and space
  # included), so every path that reaches a shell is quoted explicitly.
  PROJECT_PATH: "Don't stop"
  EXE_NAME: "Don't stop.exe"
  PCK_NAME: "Don't stop.pck"
  ZIP_NAME: "Don't stop-Windows-x64.zip"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Godot and Windows export template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tplDir = "$env:APPDATA\Godot\export_templates\4.7.2.stable"
          New-Item -ItemType Directory -Force -Path $tplDir, "$env:RUNNER_TEMP\godot" | Out-Null
          curl.exe --fail --location --retry 5 --retry-delay 3 --output "$env:RUNNER_TEMP\godot\godot.zip" "$env:GODOT_RELEASE_BASE/Godot_v$($env:GODOT_VERSION)_win64.exe.zip"
          Expand-Archive "$env:RUNNER_TEMP\godot\godot.zip" -DestinationPath "$env:RUNNER_TEMP\godot\bin" -Force
          curl.exe --fail --location --retry 5 --retry-delay 3 --output "$env:RUNNER_TEMP\godot\templates.tpz" "$env:GODOT_RELEASE_BASE/Godot_v$($env:GODOT_VERSION)_export_templates.tpz"
          $tpz = "$env:RUNNER_TEMP\godot\templates.tpz"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($tpz)
          foreach ($name in @('version.txt', 'windows_release_x86_64.exe', 'windows_debug_x86_64.exe')) {
            $entry = $zip.GetEntry("templates/$name")
            if ($null -eq $entry) { continue }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$tplDir\$name", $true)
          }
          $zip.Dispose()
          echo "GODOT=$env:RUNNER_TEMP\godot\bin\Godot_v$($env:GODOT_VERSION)_win64_console.exe" >> $env:GITHUB_ENV

      - name: Import project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Absolute project directory. `--path` is absolute so Godot never has to
          # guess, and every other path below is derived from it.
          $project = Join-Path $env:GITHUB_WORKSPACE $env:PROJECT_PATH
          if (-not (Test-Path -LiteralPath (Join-Path $project 'project.godot'))) { throw "project.godot not found under $project" }
          # Use the console wrapper so pwsh waits for the editor process
          # (the plain exe detaches). Fresh runners can quit the first import
          # pass early; the second pass is a no-op when everything exists.
          & "$env:GODOT" --headless --path $project --editor --import --quit
          & "$env:GODOT" --headless --path $project --editor --import --quit
          $count = (Get-ChildItem -LiteralPath (Join-Path $project '.godot/imported') -ErrorAction SilentlyContinue | Measure-Object).Count
          echo "imported assets: $count"
          if ($count -lt 50) { throw "import produced only $count assets" }

      - name: Export Windows x64 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE $env:PROJECT_PATH
          $winDir = Join-Path $project 'build/windows'
          New-Item -ItemType Directory -Force -Path $winDir | Out-Null
          # Godot resolves a relative --export-release path against --path, so
          # passing the project-relative path together with an absolute --path
          # used to nest a second "Don't stop" level and the check then ran
          # against a file the exporter never wrote. Absolute here, absolute
          # everywhere below, so check, package and hash all describe one pair.
          $exe = Join-Path $winDir $env:EXE_NAME
          $pck = Join-Path $winDir $env:PCK_NAME
          Remove-Item -LiteralPath $exe, $pck -Force -ErrorAction SilentlyContinue
          & "$env:GODOT" --headless --path $project --export-release "Windows x64 Release" $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -LiteralPath $winDir | Format-Table Name, Length
          if (-not ((Test-Path -LiteralPath $exe) -and (Test-Path -LiteralPath $pck))) { throw "export output missing: $exe / $pck" }
          if ((Get-Item -LiteralPath $exe).Length -lt 1MB) { throw 'exported exe looks empty' }
          $nested = Join-Path $project $env:PROJECT_PATH
          if (Test-Path -LiteralPath $nested) { throw "export nested the project directory inside itself: $nested" }
          echo "EXE=$exe" >> $env:GITHUB_ENV
          echo "PCK=$pck" >> $env:GITHUB_ENV

      - name: Package ZIP and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'stage/DontStop'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $env:EXE $stage
          Copy-Item -LiteralPath $env:PCK $stage
          $zip = Join-Path $env:RUNNER_TEMP $env:ZIP_NAME
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          "$sha  $env:ZIP_NAME" | Out-File "$zip.sha256" -Encoding ascii
          Move-Item -LiteralPath $zip "$env:ZIP_NAME"
          Move-Item -LiteralPath "$zip.sha256" "$env:ZIP_NAME.sha256"
          Get-Item -LiteralPath "$env:ZIP_NAME" | Select-Object Name, Length
          Get-FileHash -LiteralPath "$env:ZIP_NAME" -Algorithm SHA256 | Format-List

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DontStop-Windows-x64
          path: |
            Don't stop-Windows-x64.zip
            Don't stop-Windows-x64.zip.sha256
          retention-days: 14

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            "Don't stop-Windows-x64.zip" "Don't stop-Windows-x64.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
