<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Don't Stop</title>
  <desc id="d">A top-down arena: a lone shooter with a dash trail fires at enemies converging from several directions. An illustration of the game's combat loop, not a screenshot.</desc>
  <rect width="1200" height="320" fill="#0c0f12"/>
  <g fill="none" stroke="#1c2a33" stroke-width="2">
    <circle cx="900" cy="160" r="150"/>
    <circle cx="900" cy="160" r="96"/>
    <path d="M740 160H1060M900 20V300"/>
  </g>
  <text x="56" y="150" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="72" font-weight="700" letter-spacing="2" fill="#f3dca6">DON'T STOP</text>
  <text x="58" y="212" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="38" fill="#d9a24f">Keep moving.</text>
  <path d="M58 246h110" stroke="#f3dca6" stroke-width="6"/>

  <!-- Dash trail -->
  <g fill="#f3dca6">
    <circle cx="820" cy="206" r="7" opacity=".18"/>
    <circle cx="846" cy="192" r="9" opacity=".32"/>
    <circle cx="872" cy="178" r="11" opacity=".55"/>
  </g>
  <!-- Player -->
  <circle cx="900" cy="160" r="17" fill="#f3dca6"/>
  <circle cx="906" cy="156" r="5" fill="#0c0f12"/>
  <!-- Shots -->
  <g stroke="#d9a24f" stroke-width="4" stroke-linecap="round">
    <path d="M930 140L988 104"/>
    <path d="M936 160H1010"/>
    <path d="M926 182L982 220"/>
  </g>
  <!-- Enemies -->
  <g fill="#d2523e">
    <rect x="1000" y="86" width="26" height="26" rx="4"/>
    <rect x="1030" y="147" width="26" height="26" rx="4"/>
    <rect x="994" y="218" width="26" height="26" rx="4"/>
    <rect x="768" y="70" width="22" height="22" rx="4"/>
    <rect x="812" y="258" width="22" height="22" rx="4"/>
    <rect x="1090" y="60" width="22" height="22" rx="4"/>
    <rect x="1100" y="250" width="22" height="22" rx="4"/>
  </g>
</svg>
