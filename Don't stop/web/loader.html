<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<title>Don't Stop</title>
	$GODOT_HEAD_INCLUDE
	<style>
		html, body {
			margin: 0; padding: 0; width: 100%; height: 100%;
			/* Matches boot_splash/bg_color so the shell, the boot splash and the
			   loading scene all share one background. */
			background: #0d0c17; color: #e8e6f0;
			font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
			overflow: hidden; user-select: none; -webkit-user-select: none;
		}
		/* The canvas is mounted and drawing *behind* the shell from the first
		   frame. The shell never hides the game to "reveal" it later; it only
		   removes its own opaque cover once the game says the title menu is up,
		   so what the player sees after loading is the real, already-drawn menu. */
		#canvas-host { position: absolute; inset: 0; }
		#canvas-host canvas { outline: none; display: block; }
		#frame {
			position: absolute; inset: 0; z-index: 10;
			display: flex; flex-direction: column; align-items: center; justify-content: center;
			background: #0d0c17;
			transition: opacity .12s ease-out;
		}
		#frame.gone { opacity: 0; pointer-events: none; }
		#brand { display: flex; flex-direction: column; align-items: center; gap: 14px; }
		#brand img { width: 128px; height: 128px; image-rendering: pixelated; border-radius: 18px; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
		#brand h1 { margin: 0; font-size: 28px; letter-spacing: 2px; font-weight: 700; }
		#status { margin-top: 6px; font-size: 14px; color: #9d9ab5; min-height: 20px; }
		#bar { position: relative; width: min(320px, 80vw); height: 10px; margin-top: 14px; border-radius: 6px; background: #1f1d31; overflow: hidden; }
		#bar-fill { width: 100%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #7b6cff, #4dc9ff); transform: scaleX(0); transform-origin: left; transition: transform .18s ease-out; }
		/* Measured stage completion and ongoing activity are separate. Only
		   completed work advances the fill; compositor motion invents no progress. */
		#bar::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(180,220,255,.35), transparent); opacity: 0; }
		#bar.busy::after { opacity: 1; animation: sweep 1.15s linear infinite; }
		@keyframes sweep {
			0%   { transform: translateX(-110%); }
			100% { transform: translateX(260%); }
		}
		@media (prefers-reduced-motion: reduce) {
			#bar.busy::after { animation: none; transform: translateX(75%); }
			#bar-fill, #frame { transition: none; }
		}
		#error { display: none; margin-top: 18px; max-width: 420px; padding: 12px 16px; font-size: 14px;
			color: #ff9d9d; background: #2a1420; border-radius: 8px; text-align: center; line-height: 1.5; }
		#retry { display: none; margin-top: 14px; padding: 10px 34px; font-size: 15px; letter-spacing: 2px;
			color: #fff; background: #5a4fd8; border: none; border-radius: 10px; cursor: pointer; }
		#retry:hover { background: #6c61ee; }
		#note { position: absolute; bottom: 12px; font-size: 12px; color: #9d9ab5; }
	</style>
</head>
<body>
	<div id="canvas-host"><canvas id="canvas"></canvas></div>
	<div id="frame">
		<div id="brand">
			<img src="index.icon.png" alt="Don't Stop" onerror="this.style.display='none'" />
			<h1>Don't Stop</h1>
			<div id="status" role="status">正在准备…</div>
			<div id="bar" role="progressbar" aria-label="游戏启动" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"><div id="bar-fill"></div></div>
			<div id="error"></div>
			<button id="retry" type="button">重 试</button>
		</div>
		<div id="note">Don't Stop</div>
	</div>
	<script>
	// Godot's WebGL commit path reads SCISSOR_TEST before every offscreen
	// framebuffer blit. On ANGLE this boolean read is a synchronous round-trip.
	// Track only this boolean state per context so the engine receives the same
	// value without asking the driver to flush; every other WebGL query and every
	// enable/disable call keeps its original this/arguments/return/exception.
	(function installScissorStateCache() {
		const SCISSOR_TEST = 0x0C11;
		for (const type of [window.WebGLRenderingContext, window.WebGL2RenderingContext]) {
			if (!type) continue;
			const proto = type.prototype;
			if (!proto || proto.__dontStopScissorCache) continue;
			const originalGetParameter = proto.getParameter;
			const originalEnable = proto.enable;
			const originalDisable = proto.disable;
			if (!originalGetParameter || !originalEnable || !originalDisable) continue;
			const states = new WeakMap();
			const watched = new WeakSet();
			const lost = new WeakSet();
			function watch(context) {
				if (watched.has(context)) return;
				watched.add(context);
				context.canvas.addEventListener('webglcontextlost', function () {
					lost.add(context);
					states.set(context, null);
				});
				context.canvas.addEventListener('webglcontextrestored', function () {
					lost.delete(context);
					states.delete(context);
				});
			}
			proto.getParameter = function (pname) {
				if (pname !== SCISSOR_TEST) return originalGetParameter.apply(this, arguments);
				watch(this);
				if (!states.has(this)) states.set(this, originalGetParameter.apply(this, arguments));
				return states.get(this);
			};
			proto.enable = function (cap) {
				const result = originalEnable.apply(this, arguments);
				if (cap === SCISSOR_TEST) { watch(this); if (!lost.has(this)) states.set(this, true); }
				return result;
			};
			proto.disable = function (cap) {
				const result = originalDisable.apply(this, arguments);
				if (cap === SCISSOR_TEST) { watch(this); if (!lost.has(this)) states.set(this, false); }
				return result;
			};
			Object.defineProperty(proto, '__dontStopScissorCache', { value: true });
		}
	})();
	</script>
	<script src="$GODOT_URL" onerror="window.__dontStopEngineScriptFailed = true"></script>
	<script>
	(function () {
		const GODOT_CONFIG = $GODOT_CONFIG;
		const params = new URLSearchParams(location.search);
		const statusEl = document.getElementById('status');
		const barEl = document.getElementById('bar');
		const fillEl = document.getElementById('bar-fill');
		const errEl = document.getElementById('error');
		const retryEl = document.getElementById('retry');
		const frameEl = document.getElementById('frame');
		const hostEl = document.getElementById('canvas-host');

		// Contract with autoload/Utils.gd (WEB_SHELL_HOOKS). These are the only
		// hooks the game calls; a rename on one side and not the other used to be
		// invisible because the shell's fallback timer still removed the overlay.
		const HOOK_READY = 'ready';
		const HOOK_FAILED = 'failed';
		// Stage progress from the game (autoload/Utils.gd, notify_web_boot_stage).
		// Without it the shell sees one anonymous wait between "engine is up" and
		// "menu is ready" and cannot tell a slow load from a dead one.
		const HOOK_STAGE = 'stage';
		// Fault injection for the acceptance test only: ?noready=1 makes the shell
		// ignore the game's completion notice, so the test can prove that a broken
		// handshake is never accepted - the cover stays up and a retry is offered.
		const SUPPRESS_READY = params.has('noready');

		// Everything the acceptance test needs to tell "the game told us it is
		// ready" apart from "the load stalled". There is no third answer.
		// The cover is NEVER removed on a timer. There is no "give up and show it
		// anyway" path left, because that is what revealed a still-loading game and
		// then looked like a successful start: the deployed site was measured
		// reporting a healthy notice at 20923 ms, past the old fixed 20 s deadline,
		// so the deadline - not the game - decided what the player saw. A stalled
		// load now keeps the cover up, says so, and offers a retry, and a notice
		// that arrives later is still honoured.
		const STALL_WINDOW_MS = 45000;
		const state = window.__dontStopState = {
			contract: 'dontstop-shell/3',
			hookNames: [HOOK_READY, HOOK_FAILED, HOOK_STAGE],
			navigationStartedAt: performance.now(),
			// Stage timestamps, so download / engine bring-up / scene preparation /
			// warm-up / menu can be told apart instead of being one anonymous wait.
			stages: {},
			gameStages: {},
			completedStageFraction: 0,
			activeStage: 'navigating',
			lastProgressAt: null,
			downloadStartedAt: null,
			// When the engine reported that it is up and running.
			engineStartedAt: null,
			readyNoticeAt: null,
			overlayRemovedAt: null,
			// pending | game-reported-ready | stalled | engine-error
			outcome: 'pending',
			// Only ever 'game-reported-ready', so "how did the player get past the
			// cover" cannot be answered by anything else.
			revealedBy: null,
			stallWindowMs: STALL_WINDOW_MS,
			stallWarnedAt: null,
			stallWarnings: 0,
			// true when this page was asked to simulate a missing notice.
			readyNoticeSuppressed: SUPPRESS_READY,
			errorMessage: null,
			frame: {
				startedAt: performance.now(), lastAt: null, menuVisibleAt: null,
				allGaps: [], menuGaps: [], longTasks: [], summary: null
			},
		};

		let revealed = false;
		let fatal = false;
		let engineStarted = false;
		let readyReported = false;
		let stallTimer = null;
		let frameTraceActive = true;

		function sampleFrame(now) {
			if (!frameTraceActive) return;
			const frame = state.frame;
			if (frame.lastAt !== null) {
				const gap = now - frame.lastAt;
				frame.allGaps.push(gap);
				if (frame.menuVisibleAt !== null && now <= frame.menuVisibleAt + 10000) {
					frame.menuGaps.push(gap);
				}
			}
			frame.lastAt = now;
			if (frame.menuVisibleAt !== null && now >= frame.menuVisibleAt + 10000) {
				const sorted = frame.menuGaps.slice().sort(function (a, b) { return a - b; });
				const percentile = function (fraction) {
					if (!sorted.length) return -1;
					return sorted[Math.max(0, Math.min(sorted.length - 1, Math.ceil(sorted.length * fraction) - 1))];
				};
				frame.summary = {
					samples: sorted.length,
					p95_ms: percentile(0.95), p99_ms: percentile(0.99),
					max_ms: sorted.length ? sorted[sorted.length - 1] : -1,
					over50: sorted.filter(function (v) { return v > 50; }).length,
					over100: sorted.filter(function (v) { return v > 100; }).length,
					over250: sorted.filter(function (v) { return v > 250; }).length,
					over1000: sorted.filter(function (v) { return v > 1000; }).length,
				};
				frameTraceActive = false;
				log('startup-frame-summary ' + JSON.stringify(frame.summary));
				return;
			}
			requestAnimationFrame(sampleFrame);
		}
		requestAnimationFrame(sampleFrame);
		if (window.PerformanceObserver) {
			try {
				const longTaskObserver = new PerformanceObserver(function (list) {
					list.getEntries().forEach(function (entry) {
						state.frame.longTasks.push({start_ms: entry.startTime, duration_ms: entry.duration});
					});
				});
				longTaskObserver.observe({type: 'longtask', buffered: true});
			} catch (ignored) {}
		}

		function setStatus(text, busy) {
			statusEl.textContent = text;
			barEl.setAttribute('aria-valuetext', text);
			barEl.classList.toggle('busy', !!busy);
		}
		function setProgress(fraction, text) {
			// Transfer, engine setup, drawn menu: three actual stages, not a timer.
			const limit = readyReported ? 1 : 2 / 3;
			state.completedStageFraction = Math.max(state.completedStageFraction, Math.min(limit, fraction));
			fillEl.style.transform = 'scaleX(' + state.completedStageFraction + ')';
			barEl.setAttribute('aria-valuenow', String(state.completedStageFraction * 3));
			setStatus(text, !readyReported);
		}
		function log(message) { console.log('[loader] ' + message); }

		// The one and only way the game becomes playable. Nothing here fakes a
		// user gesture: the player's first click is the game's own menu button.
		// `outcome` records HOW it was reached, and the acceptance test refuses to
		// treat anything but 'game-reported-ready' as a successful start.
		function reveal(reason) {
			if (revealed) return;
			revealed = true;
			if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
			state.outcome = reason;
			state.revealedBy = reason;
			state.overlayRemovedAt = performance.now();
			if (reason === 'game-reported-ready' && state.frame.menuVisibleAt === null) {
				state.frame.menuVisibleAt = state.overlayRemovedAt;
			}
			log('revealing the running game (' + reason + ') at ' + Math.round(state.overlayRemovedAt) + 'ms');
			frameEl.classList.add('gone');
			setTimeout(function () {
				if (revealed) frameEl.style.display = 'none';
			}, 300);
		}

		// Progress from any stage re-arms the stall check. A stalled load is
		// reported, never revealed: the cover stays, the player is told what is
		// happening, and the retry button reloads the page. If the game does report
		// readiness afterwards, the notice still wins and the warning is dropped.
		function mark(stage) {
			if (revealed || fatal) return;
			const now = performance.now();
			state.activeStage = stage;
			state.stages[stage] = now;
			state.lastProgressAt = now;
			log('stage ' + stage + ' at ' + Math.round(now) + 'ms');
			// Progress resumed: a stall hint from an earlier quiet interval is no
			// longer true, so it is withdrawn instead of sitting there while the game
			// is demonstrably still loading.
			if (state.stallWarnedAt !== null) {
				errEl.style.display = 'none';
				retryEl.style.display = 'none';
				state.outcome = 'pending';
				setStatus('正在准备…', true);
			}
			armStallCheck();
		}

		function armStallCheck() {
			if (stallTimer) clearTimeout(stallTimer);
			stallTimer = setTimeout(function () {
				stallTimer = null;
				if (revealed || fatal || readyReported) return;
				const idle = Math.round(performance.now() - (state.lastProgressAt || state.navigationStartedAt));
				state.outcome = 'stalled';
				state.stallWarnedAt = performance.now();
				state.stallWarnings += 1;
				log('no progress for ' + idle + 'ms; keeping the cover and offering a retry');
				setStatus('仍在加载（' + state.activeStage + '）… ' + Math.round(idle / 1000) + ' 秒没有新进展', true);
				errEl.textContent = '加载比预期慢：游戏仍在尝试载入，画面会保持在这里。可以继续等待，' +
					'也可以重试；若反复如此，请检查网络或换一个浏览器。';
				errEl.style.display = 'block';
				retryEl.style.display = 'inline-block';
				// Keep watching: a late completion still gets through.
				armStallCheck();
			}, STALL_WINDOW_MS);
		}

		function showError(message) {
			if (fatal || revealed) return;
			fatal = true;
			if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
			log('fatal: ' + message);
			state.outcome = 'engine-error';
			state.errorMessage = message;
			errEl.textContent = message;
			errEl.style.display = 'block';
			retryEl.style.display = 'inline-block';
			statusEl.textContent = '加载失败';
			barEl.classList.add('busy');
			// A reload is the only retry that cannot leave a half-initialised
			// engine with duplicate input hooks behind: the page, the canvas and
			// the engine all start over together.
			retryEl.addEventListener('click', function () { location.reload(); });
		}

		// The game calls these from GDScript (autoload/Utils.gd, WEB_SHELL_HOOKS)
		// once the real title menu has been drawn. Full warmup is optional and
		// never gates the Web menu. The engine's
		// startGame() promise alone only means "the engine booted".
		window.__dontStop = {
			ready: function () {
				if (fatal || revealed) return;
				state.readyNoticeAt = performance.now();
				if (SUPPRESS_READY) {
					// Fault injection: behave exactly as if the game never called
					// back, so the test can prove a missing notice is NOT accepted.
					log('completion notice SUPPRESSED by ?noready=1');
					return;
				}
				readyReported = true;
				if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
				fillEl.style.transition = 'none';
				setProgress(1, '准备完成');
				errEl.style.display = 'none';
				retryEl.style.display = 'none';
				state.outcome = 'pending';
				reveal('game-reported-ready');
			},
			failed: function (message) {
				showError(String(message || '游戏在初始化时报告了一个错误。'));
			},
			// Stage progress. Only ever called with the identifier strings this
			// project defines, and only used to tell "slow" from "stuck".
			stage: function (name) {
				mark(String(name || 'unknown'));
				if (!revealed && !fatal && name === 'scene-prep') setProgress(2 / 3, '正在呈现主菜单…');
			}
		};

		window.addEventListener('unhandledrejection', function (event) {
			const reason = event && event.reason;
			showError('游戏加载失败，请重试。' + (reason && reason.message ? ' (' + reason.message + ')' : ''));
		});

		if (window.__dontStopEngineScriptFailed || typeof Engine === 'undefined') {
			showError('引擎脚本加载失败。请检查网络后重试；如果反复失败，可能是资源被拦截。');
			return;
		}

		GODOT_CONFIG.canvas = document.getElementById('canvas');
		// Keep the engine's internal resolution fixed; CSS scales the canvas.
		GODOT_CONFIG.canvasResizePolicy = 2;
		// CI smoke mode: index.html?smoke=1 passes --smoke to the game.
		// ?nw=1 additionally skips VFX warm-up (A/B cold-path measurement).
		// ?e2e=1 arms the real-input aim harness and ?tour=1 walks the product
		// screens for visual evidence. All are test-only flags; none of them is
		// needed to play, and none of them changes what a player sees.
		// ?perf=1[&stage=N][&seconds=N] arms the B11 sustained-load measurement in the
		// browser: the game departs that stage on its own and prints one machine-readable
		// performance line per second. Test-only, and it is the only way to measure a real
		// stage in a real browser, because a Web build has no command line.
		// ?stage-tour=1 arms the B11 walk over stages 31/35/39/40 inside ONE browser session, so the
		// per-stage claims are made by the game itself instead of by forty wheel events. Test-only.
		if (params.has('stage-tour')) {
			GODOT_CONFIG.args = ['--stage-tour'];
			if (params.has('probe')) GODOT_CONFIG.args.push('--probe');
		} else if (params.has('stress')) {
			// B11.1 dense-attack stress driver (test-only). B11 measured a whole Stage 39 round and
			// reported averages, which cannot show the reported problem: the human's stutter is the
			// INSTANT a laser burst and a root overlap. So it reports frame spikes, the longest run
			// of slow frames, and a conditioned split of those frames by what was happening on them.
			// It deliberately does not arm --probe: that channel reports on a 0.25 s cadence and
			// walks subtrees, and an observer that costs a frame occasionally lands in exactly the
			// number being reported. All of these are test-only flags and none of them is needed to
			// play.
			GODOT_CONFIG.args = ['--stress'];
			if (params.has('b18')) GODOT_CONFIG.args.push('--b18');
			if (params.has('normal')) GODOT_CONFIG.args.push('--b18-normal=' + params.get('normal'));
			if (params.has('shots')) GODOT_CONFIG.args.push('--b18-shots=' + params.get('shots'));
			GODOT_CONFIG.args.push('--stress-stage=' + (parseInt(params.get('stage'), 10) || 39));
			GODOT_CONFIG.args.push('--stress-seconds=' + (parseInt(params.get('seconds'), 10) || 90));
			GODOT_CONFIG.args.push('--stress-scenario=' + (params.get('scenario') || 'A'));
			GODOT_CONFIG.args.push('--stress-seed=' + (parseInt(params.get('seed'), 10) || 20260918));
			GODOT_CONFIG.args.push('--stress-lasers=' + (parseInt(params.get('lasers'), 10) || 0));
			GODOT_CONFIG.args.push('--stress-root=' + (parseFloat(params.get('root')) || 0));
			// B11.2 adds the two density amplifiers and the visual-isolation switches. `enemies`
			// tops the population up out of the stage's own role list (never past the stage's own
			// cap), `barrage` holds the real laser/artillery/root/poison families alive together,
			// and `iso` names the purely-visual parts to switch off one at a time (vfx, labels,
			// trails, fogcore, tddecor, particles). All test-only; none of them is needed to play.
			GODOT_CONFIG.args.push('--stress-enemies=' + (parseInt(params.get('enemies'), 10) || 0));
			GODOT_CONFIG.args.push('--stress-barrage=' + (parseInt(params.get('barrage'), 10) || 0));
			if (params.has('iso')) GODOT_CONFIG.args.push('--stress-iso=' + params.get('iso'));
			if (params.get('park') === '1') GODOT_CONFIG.args.push('--stress-park=1');
			GODOT_CONFIG.args.push('--stress-label=' + (params.get('label') || 'run'));
			if (params.has('camp_cycles')) GODOT_CONFIG.args.push('--stress-camp-cycles=' + params.get('camp_cycles'));
			if (params.has('controlled_boss')) GODOT_CONFIG.args.push('--stress-controlled-boss');
			if (params.has('measurement')) GODOT_CONFIG.args.push('--stress-measurement=' + params.get('measurement'));
			if (params.has('mode')) GODOT_CONFIG.args.push('--stress-mode=' + params.get('mode'));
			if (params.has('source')) GODOT_CONFIG.args.push('--stress-source=' + params.get('source'));
			if (params.has('normal_hp')) GODOT_CONFIG.args.push('--stress-normal-hp');
			if (params.has('weapons')) GODOT_CONFIG.args.push('--stress-weapons=' + params.get('weapons'));
		} else if (params.has('perf')) {
			// The measurement is published on the read-only probe channel, so arming one always arms
			// the other: `?perf=1` alone used to arm a mode whose lines were never printed.
			GODOT_CONFIG.args = ['--perf', '--probe'];
			GODOT_CONFIG.args.push('--perf-stage=' + (parseInt(params.get('stage'), 10) || 39));
			GODOT_CONFIG.args.push('--perf-seconds=' + (parseInt(params.get('seconds'), 10) || 75));
		} else if (params.has('smoke')) {
			GODOT_CONFIG.args = ['--smoke'];
			if (params.has('nw')) GODOT_CONFIG.args.push('--no-warmup');
			if (params.has('e2e')) GODOT_CONFIG.args.push('--e2e');
			if (params.has('tour')) GODOT_CONFIG.args.push('--tour');
			// ?probe=1 composes with the harness instead of replacing it: the
			// read-only channel is what the acceptance driver reads its fire
			// evidence from (bullet count, projectile generation, flight vector),
			// and it only observes - it starts no driver, mutates no node and
			// writes no game state. Without this the fire chain would have to be
			// judged from screenshots again, which is exactly the cost this round
			// removes.
			if (params.has('probe')) GODOT_CONFIG.args.push('--probe');
		} else if (params.has('probe')) {
			// ?probe=1 arms ONLY the read-only observation channel: no smoke
			// driver, no e2e harness, no scene-tree mutation, so the session the
			// driver sees is the session a player gets. It exists because the
			// nothreads export keeps the game loop on the browser main thread, so
			// every screenshot/evaluate has to wait for a slot on it - the same
			// capture that costs ~32 ms locally measured ~30 s per call on a
			// GitHub runner. The driver reads state off the console stream
			// instead, which needs no page round trip at all.
			GODOT_CONFIG.args = ['--probe'];
		}

		log('args=' + JSON.stringify(GODOT_CONFIG.args || null));
		setStatus('正在初始化引擎…', true);

		let engine;
		try {
			engine = new Engine(GODOT_CONFIG);
		} catch (err) {
			showError('引擎初始化失败。' + (err && err.message ? ' (' + err.message + ')' : ''));
			return;
		}

		engineStarted = true;
		// Wasm/PCK fetch or engine bring-up failure lands here.
		state.downloadStartedAt = performance.now();
		mark('download');
		engine.startGame({
			onPrint: function () {
				// Timestamp the existing game markers on the browser clock, before
				// console transport/polling can add delay to the measured response.
				const line = Array.from(arguments).join(' ');
				const stage = /^\[startup\] stage=([^ ]+) t=(\d+) since_utils=(\d+) frame=(\d+)/.exec(line);
				if (stage && !state.gameStages[stage[1]]) {
					state.gameStages[stage[1]] = { navigation_ms: performance.now(),
						engine_ms: Number(stage[2]), since_utils_ms: Number(stage[3]), process_frame: Number(stage[4]) };
				}
				console.log.apply(console, arguments);
			},
			onProgress: function (current, total) {
				if (revealed || fatal || state.completedStageFraction >= 2 / 3) return;
				// Every download chunk is real progress: it re-arms the stall check.
				mark('download');
				if (total > 0) {
					// The only number shown is the engine's own download count.
					setProgress(Math.min(1, current / total) / 3,
						current >= total ? '资源已就绪，正在初始化引擎…' : '正在获取游戏资源…');
				} else {
					// No measurable total: say so instead of inventing a percentage.
					setStatus('正在下载游戏资源…', true);
				}
			}
		}).then(function () {
			// The engine is up. That is NOT the same as "the game is ready": the
			// title scene still has to build and draw. Full warmup is not a gate.
			state.engineStartedAt = performance.now();
			if (!revealed && !fatal) setProgress(2 / 3, '正在呈现主菜单…');
			mark('engine-init');
		}).catch(function (err) {
			const detail = err && err.message ? ' (' + err.message + ')' : '';
			showError('游戏加载失败，请重试；若反复失败请检查网络或浏览器设置。' + detail);
		});

		// Hard ceiling for a startGame() promise that never settles (e.g. a
		// truncated .wasm or a fetch that hangs forever).
		setTimeout(function () {
			if (!engineStarted || fatal || revealed) return;
			if (!readyReported) {
				showError('引擎在 5 分钟内没有完成启动。请重试；若反复失败，可能是 .wasm / .pck 未能完整下载。');
			}
		}, 300000);
	})();
	</script>
</body>
</html>
