<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<title>TowDownGame</title>
	$GODOT_HEAD_INCLUDE
	<style>
		html, body {
			margin: 0; padding: 0; width: 100%; height: 100%;
			background: #0d0c17; color: #e8e6f0;
			font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
			overflow: hidden; user-select: none; -webkit-user-select: none;
		}
		#canvas-host { position: absolute; inset: 0; display: none; }
		#canvas-host canvas { outline: none; }
		#frame { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
		#brand { display: flex; flex-direction: column; align-items: center; gap: 14px; }
		#brand img { width: 128px; height: 128px; image-rendering: pixelated; border-radius: 18px; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
		#brand h1 { margin: 0; font-size: 28px; letter-spacing: 2px; font-weight: 700; }
		#status { margin-top: 6px; font-size: 14px; color: #9d9ab5; min-height: 20px; }
		#bar { width: 320px; height: 10px; margin-top: 14px; border-radius: 6px; background: #1f1d31; overflow: hidden; }
		#bar-fill { width: 0%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #7b6cff, #4dc9ff); transition: width .15s ease-out; }
		#start { display: none; margin-top: 22px; padding: 12px 46px; font-size: 18px; letter-spacing: 4px;
			color: #fff; background: #5a4fd8; border: none; border-radius: 10px; cursor: pointer; }
		#start:hover { background: #6c61ee; }
		#error { display: none; margin-top: 18px; max-width: 420px; padding: 12px 16px; font-size: 14px;
			color: #ff9d9d; background: #2a1420; border-radius: 8px; text-align: center; }
		#note { position: absolute; bottom: 12px; font-size: 12px; color: #55516e; }
	</style>
</head>
<body>
	<div id="frame">
		<div id="brand">
			<img src="index.icon.png" alt="TowDownGame" onerror="this.style.display='none'" />
			<h1>TowDownGame</h1>
			<div id="status">正在准备…</div>
			<div id="bar"><div id="bar-fill"></div></div>
			<button id="start">点 击 开 始</button>
			<div id="error"></div>
		</div>
		<div id="note">TowDownGame · Don't Stop</div>
	</div>
	<div id="canvas-host"><canvas id="canvas"></canvas></div>
	<script src="$GODOT_URL"></script>
	<script>
	(function () {
		const GODOT_CONFIG = $GODOT_CONFIG;
		const statusEl = document.getElementById('status');
		const barEl = document.getElementById('bar');
		const fillEl = document.getElementById('bar-fill');
		const startEl = document.getElementById('start');
		const errEl = document.getElementById('error');
		const frameEl = document.getElementById('frame');
		const hostEl = document.getElementById('canvas-host');
		let gameReady = false;

		function setStatus(text) { statusEl.textContent = text; }
		function showError(text) {
			errEl.textContent = text;
			errEl.style.display = 'block';
			setStatus('加载失败');
		}

		GODOT_CONFIG.canvas = document.getElementById('canvas');
		// Keep the engine's internal resolution fixed; CSS scales the canvas.
		GODOT_CONFIG.canvasResizePolicy = 2;
		// CI smoke mode: index.html?smoke=1 passes --smoke to the game.
		// ?nw=1 additionally skips VFX warm-up (A/B cold-path measurement).
		// ?e2e=1 arms the real-input Pointer Lock harness, ?tour=1 walks the
		// product screens for visual evidence. All are test-only flags.
		if (new URLSearchParams(location.search).has('smoke')) {
			GODOT_CONFIG.args = ['--smoke'];
			if (new URLSearchParams(location.search).has('nw')) GODOT_CONFIG.args.push('--no-warmup');
			if (new URLSearchParams(location.search).has('e2e')) GODOT_CONFIG.args.push('--e2e');
			if (new URLSearchParams(location.search).has('tour')) GODOT_CONFIG.args.push('--tour');
		}

		console.log('[loader] args=' + JSON.stringify(GODOT_CONFIG.args || null));
		const engine = new Engine(GODOT_CONFIG);
		engine.startGame({
			onProgress: function (current, total) {
				if (total > 0) {
					const pct = Math.round(current / total * 100);
					fillEl.style.width = pct + '%';
					setStatus('正在下载游戏资源… ' + pct + '%');
				} else {
					fillEl.style.width = '100%';
					setStatus('正在加载…');
				}
			}
		}).then(function () {
			gameReady = true;
			hostEl.style.display = 'block';
			setStatus('');
			barEl.style.display = 'none';
			startEl.style.display = 'inline-block';
		}).catch(function (err) {
			showError('游戏加载失败，请刷新页面重试。' + (err && err.message ? ' (' + err.message + ')' : ''));
		});

		// Click-to-start only reveals the running game; the click itself provides the
		// browser user gesture Godot needs for Pointer Lock and audio playback.
		startEl.addEventListener('click', function () {
			if (!gameReady) return;
			frameEl.style.display = 'none';
			document.title = 'TowDownGame';
			try { document.getElementById('canvas').focus(); } catch (e) {}
			if (engine.rtenv) {
				// Notify the game that the player has started (gesture available).
				// The game polls this via JavaScript bridge-free path: see Utils.gd.
				document.getElementById('canvas').dispatchEvent(new Event('towdown-start'));
			}
		});
	})();
	</script>
</body>
</html>
